<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeLab – impara JavaScript</title>
  <meta name="description" content="Quiz, debugging, simulazioni d'esame e statistiche per imparare JavaScript. Funziona offline.">
  <meta name="theme-color" content="#4338ca">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CodeLab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">CodeLab</h1>
    <span id="net" class="pill" hidden>Offline</span>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <p class="muted center pad">Caricamento…</p>
  </main>

  <nav id="nav" aria-label="Sezioni">
    <a href="#/" data-tab="home">Oggi</a>
    <a href="#/quiz" data-tab="quiz">Quiz</a>
    <a href="#/debug" data-tab="debug">Debug</a>
    <a href="#/sim" data-tab="sim">Simula</a>
    <a href="#/stats" data-tab="stats">Statistiche</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="pad">CodeLab richiede JavaScript attivo.</p></noscript>

  <!-- Contenuti -->
  <script src="js/quiz-a.js"></script>
  <script src="js/quiz-b.js"></script>
  <script src="js/quiz-c.js"></script>
  <script src="js/debug-data.js"></script>
  <!-- Logica -->
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/stats.js"></script>
  <!-- Interfaccia -->
  <script src="js/core.js"></script>
  <script src="js/view-home.js"></script>
  <script src="js/view-quiz.js"></script>
  <script src="js/view-debug.js"></script>
  <script src="js/view-sim.js"></script>
  <script src="js/view-stats.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
